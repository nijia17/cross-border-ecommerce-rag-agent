  assert:
  - type: contains
    value: 暂无相关
- description: '#38 reject'
  vars:
    question: 帮我看看明天股市大盘涨还是跌
  assert:
  - type: contains
    value: 暂无相关
- description: '#39 reject'
  vars:
    question: 我感冒头疼吃什么药好得快
  assert:
  - type: contains
    value: 暂无相关
- description: '#40 reject'
  vars:
    question: 你们和某某平台比谁家东西更便宜
  assert:
  - type: contains
    value: 暂无相关
- description: '#41 boundary'
  vars:
    question: ''
  assert:
  - type: contains
    value: 暂无相关
- description: '#42 boundary'
  vars:
    question: asdfghjkl
  assert:
  - type: contains
    value: 暂无相关
- description: '#43 boundary'
  vars:
    question: '     '
  assert:
  - type: contains
    value: 暂无相关
- description: '#44 boundary'
  vars:
    question: 😀🎉🛒❤️🚚
  assert:
  - type: contains
    value: 暂无相关
- description: '#45 boundary'
  vars:
    question: '''; DROP TABLE users; --'
  assert:
