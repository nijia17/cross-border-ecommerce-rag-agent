- description: '#55 multilingual'
  vars:
    question: 送料はいくらですか？日本への発送です。
  assert:
  - type: contains
    value: 计费重量
- description: '#56 multihop'
  vars:
    question: 我的包裹被海关扣了，如果要补税，税费通知要求多久内交？
  assert:
  - type: contains
    value: 7天
- description: '#57 multihop'
  vars:
    question: DHL和经济小包比，哪个更快？时效大概差多少天？
  assert:
