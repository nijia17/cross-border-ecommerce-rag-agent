description: 跨境电商 RAG 智能问答 Agent 评测（60 条，9 类高压场景分层盲测）
prompts:
- prompt.txt
providers:
- id: python:promptfoo_provider.py
  label: kb-rag-agent
  config:
    timeout: 60000
tests:
- description: '#1 regular'
  vars:
    question: 从国内发往美国的包裹一般多久可以收到？
  assert:
  - type: contains
    value: 7-12
- description: '#2 regular'
  vars:
    question: 什么是关税？
  assert:
  - type: contains
    value: 海关
  - type: contains
    value: HS编码
- description: '#3 regular'
  vars:
    question: 支持7天无理由退货吗？
  assert:
  - type: contains
    value: 7天
  - type: contains
    value: 不影响二次销售
- description: '#4 regular'
  vars:
    question: 支持哪些支付方式？
  assert:
  - type: contains
    value: Visa
  - type: contains
    value: PayPal
- description: '#5 regular'
  vars:
    question: 电器的电压是多少，国内使用需要变压器吗？
  assert:
  - type: contains
    value: 100-240V
  - type: contains
    value: 变压器
- description: '#6 regular'
  vars:
    question: 在哪里可以查看我的订单？
  assert:
  - type: contains
    value: 我的订单
- description: '#7 regular'
  vars:
    question: 忘记密码怎么办？
  assert:
  - type: contains
    value: 忘记密码
  - type: contains
    value: 重置
- description: '#8 regular'
  vars:
    question: CE认证是什么？
  assert:
  - type: contains
    value: 欧盟
  - type: contains
    value: 合格标志
- description: '#9 regular'
  vars:
    question: 什么是价格保护？
  assert:
  - type: contains
    value: 差价
  - type: contains
    value: 7-15
- description: '#10 regular'
  vars:
    question: 人工客服的服务时间是几点？
  assert:
  - type: contains
    value: 9:00-22:00
- description: '#11 regular'
  vars:
    question: 发往日本的快递一般几天能到？
  assert:
  - type: contains
    value: 4-8
- description: '#12 regular'
  vars:
    question: 英国的VAT是怎么规定的？
  assert:
  - type: contains
    value: 135英镑
  - type: contains
    value: 20%
- description: '#13 regular'
  vars:
    question: 清关一般需要多久？
  assert:
  - type: contains
    value: 1-3个工作日
- description: '#14 regular'
  vars:
    question: HS编码是什么，有什么用？
  assert:
  - type: contains
    value: 归类
  - type: contains
    value: 税率
- description: '#15 regular'
  vars:
    question: IPX7防水等级是什么意思？
  assert:
  - type: contains
    value: 浸水
  - type: contains
    value: 1米
- description: '#16 regular'
  vars:
    question: 退款一般多久能到账？
  assert:
  - type: contains
    value: 1-3个工作日
- description: '#17 fuzzy'
  vars:
    question: 美国快递一般几天到
  assert:
  - type: contains
    value: 7-12
- description: '#18 fuzzy'
  vars:
    question: 我包裹物流一直没更新咋办
  assert:
  - type: contains
    value: 3-7天
  - type: contains
    value: 查件
- description: '#19 fuzzy'
  vars:
    question: 信用卡付不了款咋整
  assert:
  - type: contains
    value: 额度
  - type: contains
    value: 3D
- description: '#20 fuzzy'
  vars:
    question: 衣服尺码不合适想换
  assert:
  - type: contains
    value: 尺码换货
  - type: contains
    value: 运费
- description: '#21 fuzzy'
  vars:
    question: 货都发出去了，收货地址还能改不
  assert:
  - type: contains
    value: 拦截
- description: '#22 fuzzy'
  vars:
    question: 钱扣了但订单显示没成功咋回事
  assert:
  - type: contains
    value: 冻结
  - type: contains
    value: 1-7
- description: '#23 fuzzy'
  vars:
    question: 退货的话钱退到哪儿去
  assert:
  - type: contains
    value: 原路
- description: '#24 fuzzy'
  vars:
    question: 被税了要去哪儿交钱啊
  assert:
  - type: contains
    value: 缴纳
- description: '#25 fuzzy'
  vars:
    question: 优惠券能不能好几张叠着用
  assert:
  - type: contains
    value: 一张
- description: '#26 fuzzy'
  vars:
    question: 可以货到了再付钱吗
  assert:
  - type: contains
    value: 暂不支持
- description: '#27 tool'
  vars:
    question: 100美元等于多少人民币？
  assert:
  - type: contains
    value: '720.00'
- description: '#28 tool'
  vars:
    question: 80欧元兑换成人民币是多少？
  assert:
  - type: contains
    value: '624.00'
- description: '#29 tool'
  vars:
    question: 500元人民币能换多少日元？
  assert:
  - type: contains
    value: '10416.67'
  - type: contains
    value: JPY
- description: '#30 tool'
  vars:
    question: 检测这句文案：“全网第一限时秒杀，百分百好评”
  assert:
  - type: contains
    value: 第一
  - type: contains
    value: 百分百
- description: '#31 tool'
  vars:
    question: 帮我把“感谢您的购买”翻译成英文
  assert:
  - type: contains
    value: Thank
- description: '#32 tool'
  vars:
    question: 把“您的包裹已发货”翻译成日语
  assert:
  - type: contains
    value: 発送
- description: '#33 tool'
  vars:
    question: 300元的香水要交多少税？
  assert:
  - type: contains
    value: '69.15'
- description: '#34 tool'
  vars:
    question: 帮我查一下订单 CB20261023A88 现在到哪了
  assert:
  - type: contains
    value: 当前状态
  - type: contains
    value: 模拟数据
- description: '#35 reject'
  vars:
    question: 今天天气怎么样？
  assert:
  - type: contains
    value: 暂无相关
- description: '#36 reject'
  vars:
    question: 帮我写一首七言律诗
  assert:
