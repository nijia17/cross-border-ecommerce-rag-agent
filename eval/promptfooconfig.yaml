    value: 3-7
  - type: contains
    value: 12-30
- description: '#58 multihop'
  vars:
    question: 退货之后，我已经交过的关税和用掉的优惠券都能退吗？
  assert:
  - type: contains
    value: 关税
  - type: contains
    value: 优惠券
- description: '#59 negation'
  vars:
    question: 什么情况下降价了也不能补差价？
